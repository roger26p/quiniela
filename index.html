<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#00713c" />
<title>Ranking · Quiniela Mundial 2026 · Luvebras 🏆</title>
<style>
  :root{
    --brand:#00713c; --brand-dark:#00532c; --brand-light:#1fc16b; --brand-glow:#2fe38a;
    --accent:#ffce1f; --accent-dark:#f0a800; --pt-red:#d8102e;
    --bg:#04140c; --bg-soft:#0a2417;
    --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.09);
    --glass-brd:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.22);
    --gold:#ffce1f; --silver:#d7dde2; --bronze:#e0894b;
    --max:480px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,'SF Pro Display',system-ui,'Segoe UI',Roboto,Arial,sans-serif;
    color:#fff; min-height:100dvh; letter-spacing:-.01em; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(circle at 50% -8%, rgba(47,227,138,.20), transparent 48%),
      radial-gradient(circle at 100% 105%, rgba(216,16,46,.34), transparent 52%),
      linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%);
    background-attachment:fixed;
  }
  .wrap{max-width:var(--max); margin:0 auto; padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); position:relative}
  .wrap::before{
    content:""; position:absolute; top:0; left:0; right:0; height:5px;
    background:linear-gradient(90deg, var(--brand) 0 40%, var(--pt-red) 40% 100%);
  }
  /* header */
  .brand{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px}
  .logo{background:#fff; color:var(--brand); border-radius:11px; padding:6px 12px; font-weight:900; letter-spacing:.5px; font-size:1rem; box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .logo span{color:var(--pt-red)}
  h1{text-align:center; font-size:1.7rem; font-weight:900; letter-spacing:-.02em; margin-top:8px}
  h1 .t{font-size:1.5rem}
  .sub{text-align:center; opacity:.8; font-size:.85rem; margin-top:2px}
  .stats{display:flex; gap:8px; justify-content:center; margin:16px 0 6px; flex-wrap:wrap}
  .stat{background:var(--glass-2); border:1px solid var(--glass-brd); border-radius:14px; padding:8px 14px; text-align:center; backdrop-filter:blur(8px)}
  .stat b{display:block; font-size:1.25rem; font-weight:900; color:var(--accent); font-variant-numeric:tabular-nums}
  .stat span{font-size:.62rem; text-transform:uppercase; letter-spacing:.8px; opacity:.75}
  .upd{text-align:center; font-size:.7rem; opacity:.55; margin:4px 0 14px}

  /* search */
  .search{display:flex; gap:8px; margin-bottom:16px}
  .search input{flex:1; padding:13px 14px; border-radius:13px; border:1.5px solid var(--glass-brd); background:var(--glass-2); color:#fff; font-size:.95rem; font-family:inherit}
  .search input::placeholder{color:rgba(255,255,255,.4)}
  .search input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,206,31,.16)}

  /* podio */
  .podium{display:grid; grid-template-columns:1fr 1.15fr 1fr; gap:8px; align-items:end; margin-bottom:18px}
  .pod{background:var(--glass-2); border:1px solid var(--glass-brd); border-radius:16px; padding:14px 8px 12px; text-align:center; backdrop-filter:blur(8px); position:relative; overflow:hidden}
  .pod .medal{font-size:1.7rem; display:block}
  .pod .nm{font-weight:800; font-size:.82rem; margin:6px 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pod .pts{font-size:1.35rem; font-weight:900; color:var(--accent); font-variant-numeric:tabular-nums}
  .pod .pts small{font-size:.6rem; opacity:.7; font-weight:700; display:block; text-transform:uppercase; letter-spacing:.5px}
  .pod .det{font-size:.62rem; opacity:.7; margin-top:3px}
  .pod.p1{border-color:var(--gold); box-shadow:0 8px 26px rgba(255,206,31,.28); transform:translateY(-6px)}
  .pod.p1 .medal{font-size:2rem}
  .pod.p2{border-color:var(--silver)}
  .pod.p3{border-color:var(--bronze)}
  .pod.p1::after,.pod.p2::after,.pod.p3::after{content:""; position:absolute; inset:0 0 auto 0; height:3px}
  .pod.p1::after{background:var(--gold)} .pod.p2::after{background:var(--silver)} .pod.p3::after{background:var(--bronze)}

  /* lista */
  .list{display:flex; flex-direction:column; gap:7px}
  .row{display:flex; align-items:center; gap:11px; background:var(--glass); border:1px solid var(--glass-brd); border-radius:13px; padding:11px 13px; backdrop-filter:blur(6px); transition:background .15s}
  .row.me{border-color:var(--accent); background:rgba(255,206,31,.12); box-shadow:0 4px 16px rgba(255,206,31,.18)}
  .row .pos{font-size:1rem; font-weight:900; min-width:30px; text-align:center; opacity:.85; font-variant-numeric:tabular-nums}
  .row .who{flex:1; min-width:0}
  .row .who .nm{font-weight:800; font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .who .tel{font-size:.68rem; opacity:.5}
  .row .sc{text-align:right}
  .row .sc .pts{font-size:1.1rem; font-weight:900; color:var(--accent); font-variant-numeric:tabular-nums}
  .row .sc .det{font-size:.64rem; opacity:.65}
  .top1 .pos,.top2 .pos,.top3 .pos{font-size:1.15rem}
  .top1 .pos{color:var(--gold)} .top2 .pos{color:var(--silver)} .top3 .pos{color:var(--bronze)}

  .msg{text-align:center; padding:40px 20px; opacity:.7; font-size:.9rem; line-height:1.6}
  .spin{width:34px; height:34px; border:3px solid var(--glass-brd); border-top-color:var(--accent); border-radius:50%; margin:30px auto; animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .foot{text-align:center; font-size:.66rem; opacity:.45; margin-top:22px; line-height:1.5}
  @media (min-width:520px){ body{padding-top:18px} .wrap{margin-top:14px; border-radius:26px; min-height:calc(100dvh - 28px)} }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="logo">LU<span>VE</span>BRAS</span></div>
  <h1>🏆 Ranking <span class="t">Mundial 2026</span></h1>
  <p class="sub">Quiniela Luvebras · fase de grupos</p>

  <div class="stats" id="stats"></div>
  <p class="upd" id="upd"></p>

  <div class="search">
    <input id="q" type="search" placeholder="🔎 Busca tu nombre…" autocomplete="off" />
  </div>

  <div id="podium" class="podium" style="display:none"></div>
  <div id="list" class="list"></div>
  <div id="state" class="msg"><div class="spin"></div>Cargando ranking…</div>

  <p class="foot">El ranking se actualiza automáticamente con los resultados de cada día.<br>Puntuación: <b id="rule"></b></p>
</div>

<script>
  // ============================================================
  // ⚙️ CONFIG — pega aquí la URL /exec de tu Apps Script
  // ============================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbxdePWnwaxQkrxsB07aF-aY77rHbdVqpXI6hMFGVaT2lz9jmqhxo26vxI-ZLX1i9mSX2A/exec";
  const REFRESH_MS = 60000; // refresco automático cada 60 s

  const $ = s => document.querySelector(s);
  let DATA = null;

  const fmtUpd = iso => {
    try { return new Date(iso).toLocaleString("es-VE",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }
    catch(e){ return ""; }
  };

  function render(){
    if(!DATA) return;
    const r = DATA.ranking || [];
    $("#stats").innerHTML =
      `<div class="stat"><b>${DATA.total_participantes||0}</b><span>Participantes</span></div>`+
      `<div class="stat"><b>${DATA.partidos_jugados||0}/${DATA.partidos_total||72}</b><span>Partidos</span></div>`;
    $("#upd").textContent = DATA.actualizado ? "Actualizado: " + fmtUpd(DATA.actualizado) : "";
    $("#rule").textContent = `${DATA.pts_ganador||3} pts por resultado acertado (ganador o empate) · +${DATA.pts_exacto||2} pts por marcador exacto`;

    if(!r.length){
      $("#podium").style.display="none"; $("#list").innerHTML="";
      $("#state").innerHTML = (DATA.partidos_jugados? "Aún sin puntos." : "El ranking aparecerá cuando se jueguen los primeros partidos. ⚽");
      $("#state").style.display="block";
      return;
    }
    $("#state").style.display="none";

    const q = $("#q").value.trim().toLowerCase();
    const medals = ["🥇","🥈","🥉"];

    // podio (top 3) solo sin búsqueda
    const pod = $("#podium");
    if(!q && r.length>=3){
      const order=[1,0,2]; // 2º, 1º, 3º
      pod.innerHTML = order.map(i=>{
        const it=r[i];
        return `<div class="pod p${it.pos}"><span class="medal">${medals[it.pos-1]||""}</span>
          <div class="nm">${esc(it.nombre)}</div>
          <div class="pts">${it.puntos}<small>pts</small></div>
          <div class="det">${it.aciertos} aciertos${it.exactos?` · ${it.exactos}🎯`:""}</div></div>`;
      }).join("");
      pod.style.display="grid";
    } else pod.style.display="none";

    const lista = q ? r.filter(it=> it.nombre.toLowerCase().includes(q)) : r;
    const desde = (!q && r.length>=3) ? 3 : 0; // si hay podio, la lista arranca en el 4º
    const visibles = q ? lista : lista.slice(desde);

    $("#list").innerHTML = visibles.map(it=>{
      const cls = it.pos<=3 ? `top${it.pos}` : "";
      const mine = q && q.length>=2 ? "me" : "";
      return `<div class="row ${cls} ${mine}">
        <div class="pos">${it.pos<=3?(medals[it.pos-1]):it.pos}</div>
        <div class="who"><div class="nm">${esc(it.nombre)}</div>${it.factura?`<div class="tel">factura ${esc(it.factura)}</div>`:""}</div>
        <div class="sc"><div class="pts">${it.puntos}</div><div class="det">${it.aciertos} ac.${it.exactos?` · ${it.exactos}🎯`:""}</div></div>
      </div>`;
    }).join("") || `<div class="msg">Sin resultados para "${esc(q)}".</div>`;
  }

  const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

  async function load(){
    if(!API_URL){
      $("#state").innerHTML = "⚙️ Falta configurar <b>API_URL</b> en el código de esta página<br>(la URL /exec de tu Apps Script).";
      return;
    }
    try{
      const resp = await fetch(API_URL, {cache:"no-store"});
      DATA = await resp.json();
      if(DATA.error){ $("#state").innerHTML = "Error: "+esc(DATA.error); return; }
      render();
    }catch(e){
      $("#state").innerHTML = "No se pudo cargar el ranking. Reintentando…";
    }
  }

  $("#q").addEventListener("input", render);
  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
